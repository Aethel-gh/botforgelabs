<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BotForgeLabs</title>
<style>
body{margin:0;font-family:Arial;background:#0b1020;color:white}
.container{width:min(1100px,calc(100% - 40px));margin:0 auto;padding:60px 20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:60px}
.brand{font-size:2rem;font-weight:800}
.btn{background:#5865F2;color:white;text-decoration:none;padding:14px 20px;border-radius:12px;font-weight:700;display:inline-block}
.btn:hover{background:#7289DA}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;margin-bottom:60px}
h1{font-size:clamp(2.5rem,7vw,4.5rem);margin:0 0 18px 0;line-height:1.1}
p{color:#cfd8ff;line-height:1.8;font-size:1.08rem}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:32px}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.feature{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:24px;text-align:center}
.feature h3{margin-top:0}
@media(max-width:800px){.hero{grid-template-columns:1fr}.features{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start;gap:18px}}
</style>
</head>
<body>
<div class="container">
<header class="topbar">
<div class="brand">BotForgeLabs</div>
<a class="btn" href="https://discord.com/invite/yourlink">招待リンク</a>
</header>

<section class="hero">
<div>
<h1>Discord サーバー運営を簡単に</h1>
<p>BotForgeLabs は、モデレーション・ログ管理・開発者機能を備えた Discord Bot です。安全で見やすい運営をサポートします。</p>
<a class="btn" href="https://discord.com/invite/yourlink">BFL を招待</a>
</div>

<div class="card">
<h2>Fast • Safe • Flexible</h2>
<p>サーバー運営に必要な機能をシンプルに提供。安全性と拡張性を重視しています。</p>
</div>
</section>

<section class="features">
<div class="feature">
<h3>🛡️ Moderation</h3>
<p>Ban / Kick / Timeout / Purge</p>
</div>
<div class="feature">
<h3>📊 Logs</h3>
<p>運営ログとケース履歴を確認</p>
</div>
<div class="feature">
<h3>⚙️ Tools</h3>
<p>開発者向けの設定と管理機能</p>
</div>
</section>
</div>
</body>
</html>
